# Nginx site config for the Flight Delay Prediction project.
#
# This file is NOT loaded by Docker Compose - this project does not run
# its own Nginx container and does not bind port 80/443. It is meant to
# be installed by the VPS administrator into the *existing* system-level
# Nginx, alongside configs for other projects on the same host.
#
# It only touches the flight-delay.duckdns.org server_name and proxies
# to the Streamlit container's published host port (1043). It does not
# touch any other server block, port, or project on the VPS.
#
# Install (requires sudo / the VPS administrator):
#   sudo cp nginx/flight-delay.duckdns.org.conf /etc/nginx/conf.d/flight-delay.duckdns.org.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# (If the existing Nginx uses sites-available/sites-enabled instead of
# conf.d, install into sites-available and symlink into sites-enabled.)

server {
    listen 80;
    listen [::]:80;
    server_name flight-delay.duckdns.org;

    # Streamlit (host port 1043 -> container port 1040). Streamlit keeps a
    # long-lived WebSocket open for live reruns, so the Upgrade/Connection
    # headers and a long read timeout are required - without them the
    # proxy will silently drop the socket and the UI will spin/disconnect.
    location / {
        proxy_pass http://127.0.0.1:1043;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Optional: uncomment to also expose FastAPI under the same domain at
    # /api/ (e.g. https://flight-delay.duckdns.org/api/health). Not enabled
    # by default - FastAPI already remains reachable directly on
    # http://<VPS_IP>:1041 as required.
    #
    # location /api/ {
    #     proxy_pass http://127.0.0.1:1041/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
