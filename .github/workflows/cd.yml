name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  build-and-push:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME="ghcr.io/ahmed77923/flight-delay-prediction"

          docker build \
            -t "$IMAGE_NAME:${{ github.event.workflow_run.head_sha }}" \
            -t "$IMAGE_NAME:latest" .

      - name: Push Docker image
        run: |
          IMAGE_NAME="ghcr.io/ahmed77923/flight-delay-prediction"

          docker push "$IMAGE_NAME:${{ github.event.workflow_run.head_sha }}"
          docker push "$IMAGE_NAME:latest"

      - name: Test SSH connection to  VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "SSH connection successful"
            whoami
            hostname


            cd ~/flight_delay_prediction

            export IMAGE_NAME=ghcr.io/ahmed77923/flight-delay-prediction:latest

            docker compose pull
            docker compose up -d
            docker compose ps