services:

  api:
    build: .
    image: flight-delay-prediction:latest

    ports:
      - "1041:8000"

    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MLFLOW_MODEL_URI: /app/model_artifact

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped


  streamlit:
    build: .
    image: flight-delay-prediction:latest

    command:
      [
        "streamlit",
        "run",
        "app/app.py",
        "--server.address=0.0.0.0",
        "--server.port=1040",
        "--server.headless=true"
      ]

    ports:
      - "1043:1040"

    environment:
      API_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest

    ports:
      - "1042:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest

    ports:
      - "1044:3000"

    volumes:
      - grafana_data:/var/lib/grafana

      # Datasource provisioning
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,Z

      # Dashboard provisioning
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z

      # Dashboard JSON
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro,Z

    depends_on:
      prometheus:
        condition: service_started

    restart: unless-stopped


volumes:
  grafana_data:

