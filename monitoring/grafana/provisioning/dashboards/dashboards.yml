apiVersion: 1

providers:
  - name: Flight Delay Dashboards
    orgId: 1
    folder: Flight Delay
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true

    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
